<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>当效率成为义务 · 全片动态预览</title><link rel="stylesheet" href="player.css"></head>
<body><main>
<header><div><p class="eyebrow">MYVIDEO · 01—06</p><h1>当效率成为义务</h1></div><p class="meta">4分40秒 · 1080p / 30fps · 无声字幕预览</p></header>
<nav id="chapters" aria-label="章节导航"></nav>
<section class="screen-wrap" aria-label="动画画面"><div id="screen"></div><div id="loading" role="status">正在准备六章素材…</div></section>
<section class="transport" aria-label="播放控制">
 <div class="buttons"><button id="play" disabled>播放</button><button id="previous" aria-label="上一镜">上一镜</button><button id="next" aria-label="下一镜">下一镜</button><button id="restart">从头播放</button><output id="clock">00:00 / 04:40</output><span class="grow"></span><label>速度 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label><input id="captions" type="checkbox" checked>字幕</label><label><input id="loop" type="checkbox">循环本章</label><button id="fullscreen">全屏</button></div>
 <input id="seek" aria-label="全片时间轴" type="range" min="0" max="8399" step="1" value="0"><div id="marks" aria-hidden="true"></div>
 <div class="context"><strong id="chapter-title"></strong><span id="shot"></span><label>镜头 <select id="shot-select" aria-label="镜头跳转"></select></label><span class="grow"></span><span id="position"></span></div>
</section>
<footer><span id="ready" role="status">准备中</span><span>字幕暂按语义排时 · 未添加配音、音效 · ← → 逐帧 / 空格播放</span><a href="captions-v01.srt" download>全片SRT</a></footer>
<details id="resources"><summary>素材与章节来源 <span id="asset-count"></span></summary><div class="resource-tools"><label>筛选章节 <select id="asset-filter"><option value="all">全部</option><option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option></select></label><p>共用素材引用同一原文件，章内合成底图单独登记。<a href="README.md">框架说明</a> · <a href="assets-v01.json">素材清单</a></p></div><div id="asset-grid"></div></details>
<details><summary>章节衔接</summary><div class="seams" id="seams"></div><p class="note">切换使用各章已有预算，不增加黑场或重复末帧。03、05的入点为不同说明情境；任务ID不互相覆盖。字幕固定屏幕位置。</p></details>
<p id="error" role="alert" hidden></p>
</main><script type="module" src="player.mjs"></script></body></html>
