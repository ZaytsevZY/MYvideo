<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>当效率成为义务 · 男声配音版</title><style>body{margin:0;background:#17232c;color:#f6f1e7;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1280px;margin:24px auto;padding:0 24px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{font-size:28px}video{display:block;width:100%;max-height:74vh;background:#101923;border-radius:10px}.transport{display:flex;align-items:center;gap:14px;margin-top:16px}.transport input{flex:1;accent-color:#d6ba87}.transport output{white-space:nowrap}#volume{flex:0 0 100px;width:100px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button,a{font:inherit}button{padding:9px 15px;color:inherit;background:#2b3d48;border:1px solid #5b6a73;border-radius:8px;cursor:pointer}a{color:#e5c58e;margin-right:22px}.meta{color:#c7d0d4}footer{padding-bottom:24px}</style></head><body><main><header><h1>当效率成为义务</h1><p class="meta">4分40秒 · 1080p · 30fps · 普通话男声配音 · 云扬 · 新稿配音与字幕已校准</p></header><video id="film" preload="auto" poster="../provenance/voice-v16/frames/frame-0060.png"></video><p id="status" class="meta" role="status">正在加载视频…</p><div class="transport"><button id="play">播放</button><input id="seek" type="range" min="0" max="280" step="0.1" value="0" aria-label="视频播放进度"><output id="clock">00:00 / 04:40</output><label for="volume">音量</label><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="配音音量"></div><nav aria-label="视频章节"><button data-time="0">01 · 效率与任务边界</button><button data-time="45">02 · 成本与任务扩张</button><button data-time="83">03 · 雇佣与工作时间</button><button data-time="122">04 · 竞争与标准</button><button data-time="177">05 · 执行与决定权</button><button data-time="222">06 · 效率与自由</button></nav><footer><a href="film-complete-captioned-voiced-v16.mp4" download>下载完整MP4</a><a href="film-subtitles-v16.srt" download>下载字幕SRT</a><a href="../../../audio/film/voice- (async()=>{try{const response=await fetch('film-complete-captioned-voiced-v16.mp4');if(!response.ok)throw Error('HTTP '+response.status);const blob=await response.blob();film.src=URL.createObjectURL(blob);film.onloadedmetadata=()=>{status.textContent='新版配音视频已就绪';seek.disabled=false;for(const button of buttons)button.disabled=false;};film.load();}catch(error){status.textContent='视频加载失败，请使用下方完整MP4链接。';console.error(error);}})();
