<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>人物独立补绘检查</title><style>body{margin:0;background:#17232c;color:#eee8dc;font:16px 'Hiragino Sans GB',sans-serif}main{max-width:1180px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between}a{color:#d7b36d}h1{font-size:26px}select,button,input{font:inherit}select,button{color:inherit;background:#2c3a44;border:1px solid #58656d;border-radius:6px;padding:8px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stage{height:54vh;margin:16px 0;background:#e9e3d8;display:grid;place-items:center;border-radius:12px;overflow:hidden}canvas{max-width:100%;max-height:54vh;object-fit:contain}#keys{display:flex;gap:8px;overflow:auto;padding:14px 0}#keys button{padding:4px;background:#e9e3d8;color:#293846}#keys img{height:120px;max-width:210px;object-fit:contain;display:block}#keys button[aria-current=true]{outline:3px solid #d7b36d}#seek{flex:1}#status{color:#b9c8d0}footer{font-size:14px;color:#b9c8d0}</style><main><header><h1>人物独立补绘检查</h1><a href="preview.html">全片动态预览</a></header><nav><select id="action" aria-label="动作选择"></select><button id="play">往返播放</button><button id="next">下一关键帧</button><span id="position"></span><input id="seek" aria-label="动作关键帧" type="range" min="0" step="1" value="0"></nav><section class="stage"><canvas id="canvas"></canvas></section><p id="status">准备动作素材…</p><section id="keys"></section><footer>只显示独立绘制的完整姿态，不使用光流。06及其余动作恢复原绘稿；正式节奏见全片预览。</footer></main><script type="module">
const $=id=>document.getElementById(id),data=await(await fetch('motion-v10.json')).json();let loaded=[],group=null,index=0,playing=false,started=0,selection=0;
const url=p=>new URL('../../'+p.replace(/^arts\//,''),import.meta.url).href;
for(const g of data.groups){const o=new Option(`${g.chapters.join('/')} · ${g.name}（${g.frames.length}帧）`,g.id);$('action').append(o);}
function show(){if(!loaded[index])return;const c=$('canvas');c.width=loaded[index].naturalWidth;c.height=loaded[index].naturalHeight;c.getContext('2d').drawImage(loaded[index],0,0);$('seek').value=index;$('position').textContent=`${index+1} / ${group.frames.length}`;for(const [i,b]of[...$('keys').children].entries())b.setAttribute('aria-current',String(i===index));}
async function select(){const request=++selection;playing=false;$('play').textContent='往返播放';group=data.groups.find(g=>g.id===$('action').value);$('status').textContent='准备动作素材…';const frames=await Promise.all(group.frames.map(f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url(f.path);})));if(request!==selection)return;loaded=frames;index=0;$('seek').max=frames.length-1;$('keys').replaceChildren(...frames.map((im,i)=>{const b=document.createElement('button');const t=im.cloneNode();b.append(t,document.createTextNode(String(i+1)));b.onclick=()=>{playing=false;$('play').textContent='往返播放';index=i;show();};return b;}));$('status').textContent=`${group.name} · ${new Set(group.frames.map(f=>f.sha256)).size}个独立可用帧`;show();}
$('action').onchange=select;$('seek').oninput=()=>{playing=false;$('play').textContent='往返播放';index=+$('seek').value;show();};$('next').onclick=()=>{playing=false;$('play').textContent='往返播放';index=(index+1)%loaded.length;show();};$('play').onclick=()=>{playing=!playing;started=performance.now();$('play').textContent=playing?'暂停':'往返播放';};function tick(now){if(playing&&group){const phase=.5-.5*Math.cos((now-started)/3000*Math.PI*2);const target=group.frames.reduce((best,f,i)=>Math.abs(f.at-phase)<Math.abs(group.frames[best].at-phase)?i:best,0);if(target!==index){index=target;show();}}requestAnimationFrame(tick);}await select();requestAnimationFrame(tick);
</script></html>
