<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>当效率成为义务 · 配音同步动态预览</title><style>body{margin:0;background:#17232c;color:#f6f1e7;font:16px -apple-system,sans-serif}main{max-width:1280px;margin:24px auto;padding:0 24px}h1{font-size:26px}.meta{color:#c7d0d4}#screen{aspect-ratio:16/9;background:#101923;max-height:74vh}#screen svg{width:100%;height:100%;display:block}audio{width:100%;margin:18px 0}nav{display:flex;flex-wrap:wrap;gap:10px}button{font:inherit;padding:9px 15px;color:inherit;background:#2b3d48;border:1px solid #5b6a73;border-radius:8px;cursor:pointer}a{color:#e5c58e}</style><main><h1>当效率成为义务</h1><p class="meta" id="status">正在准备配音同步预览…</p><div id="screen"></div><audio id="audio" preload="auto"></audio><nav id="chapters"></nav><p><a href="exports/index-v12.html">完整成片</a></p></main><script type="module">
import {createSpeechRenderer} from './speech-scene-v12.mjs';
const [bundle,alignment,captions,assets]=await Promise.all(['bundle-v01.json','provenance/voice-v12/alignment.json','captions-v12.json','assets-v01.json'].map(p=>fetch(p).then(r=>r.json())));
const audio=document.querySelector('#audio'),screen=document.querySelector('#screen'),status=document.querySelector('#status');
const render=createSpeechRenderer(bundle,alignment,captions,p=>new URL('../../'+p.replace(/^arts\//,''),location.href).href);let previous=-1;
for(const c of alignment.chapters){const b=document.createElement('button');b.textContent=c.id+' · '+Math.floor(c.start/60)+':'+String(Math.floor(c.start%60)).padStart(2,'0');b.onclick=()=>{audio.pause();audio.currentTime=c.start;};document.querySelector('#chapters').append(b);}
function show(){const f=Math.min(alignment.frames-1,Math.floor(audio.currentTime*30));if(f!==previous){previous=f;const r=render(f);screen.innerHTML=r.svg;screen.dataset.frame=f;screen.dataset.sourceTime=r.sourceTime;status.textContent=`配音同步 · ${alignment.duration.toFixed(1)}秒 · ${r.chapter.id} · ${r.cue?.text||''}`;}}function tick(){show();requestAnimationFrame(tick);}audio.onseeked=show;audio.ontimeupdate=show;tick();
const pending=[...assets.assets];await Promise.all(Array.from({length:6},async()=>{while(pending.length){const x=pending.shift();await new Promise((ok,no)=>{const im=new Image();im.onload=ok;im.onerror=no;im.src=new URL('../../'+x.path.replace(/^arts\//,''),location.href).href;});}}));const recording=await fetch('../../audio/film/voice-v12/narration-v12.wav').then(r=>r.blob());audio.src=URL.createObjectURL(recording);audio.load();audio.controls=true;
</script></html>
