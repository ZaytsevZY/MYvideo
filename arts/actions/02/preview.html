<!doctype html><meta charset="utf-8"><title>02 · 13秒无声候选</title><style>body{margin:24px;background:#263342;color:#fff;font:16px system-ui}#stage{max-width:1280px}svg{width:100%;height:auto}input{width:60%}button{padding:8px 18px;margin-right:16px}</style><h2>02开头 · 13秒无声候选</h2><p>字幕暂定排时，未配音；成本收益示意，非实测。</p><div id="stage"></div><button id="play">播放 / 暂停</button><input id="seek" type="range" min="0" max="12.966667" step="0.033333" value="0"><span id="time"></span><script type="module">import{sample,draw,svg}from'./scene.mjs';const defs="<symbol id=\"asset-document-portrait\" viewBox=\"0 0 1086 1448\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../items/01/task-document-portrait-v01.png\" width=\"1086\" height=\"1448\"/></symbol><symbol id=\"asset-avatar-programmer-neutral\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/programmer-neutral-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-avatar-programmer-focus\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/programmer-focus-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-avatar-agent-neutral\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/agent-neutral-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-avatar-agent-focus\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/agent-focus-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-cursor\" viewBox=\"0 0 70 90\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../static/01/cursor-v01.svg\" width=\"70\" height=\"90\"/></symbol><symbol id=\"asset-stage\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"provenance/opening-v02/stage-idle.png\" width=\"1920\" height=\"1080\"/></symbol><symbol id=\"asset-stage-lean\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"provenance/opening-v02/stage-lean.png\" width=\"1920\" height=\"1080\"/></symbol>";let t=0,playing=false,last=null;const stage=document.querySelector('#stage'),seek=document.querySelector('#seek');function show(){let c=draw(sample(t));if(t>=4.6&&t<5.8)c=c.replace('href="#asset-stage"','href="#asset-stage-lean"');stage.innerHTML=svg(c,defs);seek.value=t;document.querySelector('#time').textContent=t.toFixed(2)+' / 13.00s'}document.querySelector('#play').onclick=()=>{if(t>=12.96)t=0;playing=!playing;last=null};seek.oninput=()=>{t=+seek.value;show()};function tick(now){if(playing&&last!==null){t=Math.min(12.966667,t+(now-last)/1000);if(t>=12.966667)playing=false;show()}last=now;requestAnimationFrame(tick)}show();requestAnimationFrame(tick);</script>
