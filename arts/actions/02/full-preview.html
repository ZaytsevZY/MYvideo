<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 · 完整38秒</title><style>body{margin:24px;background:#263342;color:#fff;font:16px system-ui}#stage{max-width:1280px}svg{width:100%;height:auto}input{width:60%}button{padding:8px 18px}</style><h2>02 · 完整38秒无声字幕候选</h2><p>两种配置先后演示；条带仅作定性示意，字幕未配音校时。</p><div id="stage"></div><button id="play">播放 / 暂停</button><input aria-label="章节时间" id="seek" type="range" min="0" max="37.966667" step="0.033333" value="0"><span id="time"></span><script type="module">import{sample,draw,svg}from'./full-scene.mjs';const defs="<symbol id=\"asset-document-portrait\" viewBox=\"0 0 1086 1448\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../items/01/task-document-portrait-v01.png\" width=\"1086\" height=\"1448\"/></symbol><symbol id=\"asset-avatar-programmer-neutral\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/programmer-neutral-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-avatar-programmer-focus\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/programmer-focus-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-avatar-agent-neutral\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/agent-neutral-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-avatar-agent-focus\" viewBox=\"0 0 1254 1254\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../characters/portraits/01/agent-focus-v01.png\" width=\"1254\" height=\"1254\"/></symbol><symbol id=\"asset-cursor\" viewBox=\"0 0 70 90\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../static/01/cursor-v01.svg\" width=\"70\" height=\"90\"/></symbol><symbol id=\"asset-stage\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"provenance/opening-v02/stage-idle.png\" width=\"1920\" height=\"1080\"/></symbol><symbol id=\"asset-stage-lean\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"provenance/opening-v02/stage-lean.png\" width=\"1920\" height=\"1080\"/></symbol><symbol id=\"asset-document-landscape\" viewBox=\"0 0 1774 887\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../items/01/task-document-landscape-v01.png\" width=\"1774\" height=\"887\"/></symbol><symbol id=\"asset-plan-tray\" viewBox=\"0 0 1672 941\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"../../items/01/plan-tray-painted-v01.png\" width=\"1672\" height=\"941\"/></symbol><symbol id=\"asset-stage-rest\" viewBox=\"0 0 1920 1080\" preserveAspectRatio=\"xMidYMid meet\"><image href=\"provenance/full-v03/stage-rest.png\" width=\"1920\" height=\"1080\"/></symbol>";let t=0,on=false,last=null;const st=document.querySelector('#stage'),seek=document.querySelector('#seek');function show(){st.innerHTML=svg(draw(sample(t)),defs);seek.value=t;document.querySelector('#time').textContent=t.toFixed(2)+' / 38.00s'}document.querySelector('#play').onclick=()=>{if(t>=37.96)t=0;on=!on;last=null};seek.oninput=()=>{on=false;t=+seek.value;show()};function tick(now){if(on&&last!==null){t=Math.min(37.966667,t+(now-last)/1000);if(t>=37.966667)on=false;show()}last=now;requestAnimationFrame(tick)}show();requestAnimationFrame(tick);</script>
