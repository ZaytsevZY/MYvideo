<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 完整姿态与遮挡试验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172431;color:#f6f1e7;font-family:system-ui,"PingFang SC",sans-serif}
header{padding:16px 22px 8px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}
small{color:#bac8d0}.controls{padding:10px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;border:1px solid #718493;border-radius:5px;padding:7px 12px;background:#f6f1e7;color:#263342}
button{cursor:pointer;min-width:66px}input[type=range]{flex:1;min-width:220px;accent-color:#e9b468}
label{font-size:14px}#stage{max-width:1440px;margin:auto;background:#101923;aspect-ratio:16/9}
#stage svg{width:100%;height:100%;display:block}#status{padding:10px 22px;color:#c2d0d8;font-size:14px}
#loading{padding:80px;text-align:center}#error{white-space:pre-wrap;color:#ffb7a7;padding:20px}
</style>
<header><h1>01 完整姿态与遮挡试验</h1><small>程序员背向镜头 · 完整PNG叠层 · 无配音</small></header>
<div class="controls">
<button id="play" disabled>播放</button><select id="action" aria-label="动作选择"><option value="scene">01 连续动作试验 · 45秒</option></select>
<input id="seek" aria-label="时间" type="range" min="0" max="45" value="0" step=".033333">
<output id="clock">0.00 / 45.00秒</output><label><input type="checkbox" id="joints">显示图层基线</label>
</div>
<div class="controls" id="keytimes"></div>
<div id="stage"><div id="loading">加载完整姿态与场景…</div></div><div id="status">准备中</div>
<pre id="error" hidden></pre>
<script type="module">
import {rootSvg} from '../../characters/rigs/runtime/rig.mjs';
import {definitions,ACTIONS,sampleScene,sampleAction,drawRoom} from './whole-motion.mjs';
const $=s=>document.querySelector(s),stage=$('#stage');
try{
 const response=await fetch('./bundle-whole-v01.json');if(!response.ok)throw Error('素材包加载失败 '+response.status);
 const bundle=await response.json();
 for(const a of ACTIONS){const option=document.createElement('option');option.value=a.id;option.textContent=a.id+' '+a.name+' · '+a.duration+'秒';$('#action').append(option);}
 stage.innerHTML=rootSvg('<g id="picture"></g>',definitions(bundle));
 const picture=$('#picture');
 let time=0,playing=false,last=0,raf=0,duration=45;
 function render(){
  const value=$('#action').value;
  let state,actionLabel;
  if(value==='scene'){state=sampleScene(time,bundle.config);actionLabel=state.beat.name;}
  else{
   state=sampleAction(value,time);actionLabel=state.beat.name;
  }
  picture.innerHTML=drawRoom(state,bundle,{debug:$('#joints').checked});
  $('#clock').value=time.toFixed(2)+' / '+duration.toFixed(2)+'秒';
  $('#seek').value=time;
  $('#status').textContent=actionLabel+' ｜'+Object.keys(bundle.poses).length+'张完整姿态 · 关键帧衔接＋整身缓动 · 无配音预览';
  stage.dataset.time=time.toFixed(3);stage.dataset.action=value;
 }
 function stop(){playing=false;$('#play').textContent='播放';cancelAnimationFrame(raf);last=0;}
 function tick(now){
  if(!playing)return;
  if(last)time=Math.min(duration,time+(now-last)/1000);
  last=now;render();if(time>=duration){stop();return;}raf=requestAnimationFrame(tick);
 }
 $('#play').disabled=false;$('#play').onclick=()=>{if(playing){stop();return;}if(time>=duration)time=0;playing=true;last=0;$('#play').textContent='暂停';raf=requestAnimationFrame(tick);};
 $('#seek').oninput=()=>{stop();time=Number($('#seek').value);render();};
 $('#action').onchange=()=>{stop();time=0;duration=$('#action').value==='scene'?45:ACTIONS.find(a=>a.id===$('#action').value).duration;$('#seek').max=duration;render();};
 for(const [title,t] of [['初始工位',0],['伸手',1.7],['握住文件',2.3],['查看文件',3],['收手',2.8],['半起身',3.8],['离席',5],['夜转晨',7.5],['递回结果',10.3],['返回',10],['验收',12],['时间图解',20],['任务流图解',30],['任务终点',41]]){
  const b=document.createElement('button');b.textContent=title;b.onclick=()=>{stop();$('#action').value='scene';duration=45;$('#seek').max=45;time=t;render();};$('#keytimes').append(b);
 }
 $('#joints').onchange=render;render();
 window.addEventListener('pagehide',stop);
}catch(error){$('#error').hidden=false;$('#error').textContent=String(error);$('#loading')?.remove();}
</script></html>
