<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · 多机位动态预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172431;color:#f6f1e7;font-family:system-ui,"PingFang SC",sans-serif}header{padding:16px 22px 8px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}small{color:#bac8d0}.controls{padding:10px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #718493;border-radius:5px;padding:7px 11px;background:#f6f1e7;color:#263342}button{cursor:pointer;min-width:62px}button[aria-current=true]{background:#e9b468}input[type=range]{flex:1;min-width:220px;accent-color:#e9b468}label{font-size:14px}#stage{max-width:1440px;margin:auto;background:#101923;aspect-ratio:16/9;overflow:hidden}#stage svg{width:100%;height:100%;display:block}#status{padding:10px 22px;color:#c2d0d8;font-size:14px}#loading{padding:80px;text-align:center}#error{white-space:pre-wrap;color:#ffb7a7;padding:20px}.foot{padding:0 22px 14px;color:#afc1cc;font-size:13px}
</style>
<header><h1>01 · 多机位动态预览</h1><small>12镜 · 45秒预算 · 完整姿态PNG · 无配音</small></header>
<div class="controls"><button id="play" disabled>播放</button><select id="action" aria-label="预览模式"><option value="camera">新版12镜 · 45秒</option><option value="legacy">旧背面工位 · 45秒</option></select><input id="seek" aria-label="时间" type="range" min="0" max="45" value="0" step=".01"><output id="clock">0.00 / 45.00秒</output><label><input type="checkbox" id="joints">显示构图基线</label></div>
<div class="controls" id="keytimes"></div><div id="stage"><div id="loading">加载新增美术与镜头框架…</div></div><div id="status">准备中</div><div class="foot">镜头与动作按时间采样；仍是有限绘制姿态，无配音校时或视频导出。</div><pre id="error" hidden></pre>
<script type="module">
import {rootSvg} from '../../characters/rigs/runtime/rig.mjs';
import {ACTIONS,sampleScene,sampleAction,drawRoom} from './whole-motion.mjs';
import {CAMERA_BEATS,sampleCameraScene,cameraDefinitions,drawCameraScene} from './camera-motion.mjs';
const $=s=>document.querySelector(s),stage=$('#stage');
try{
 const response=await fetch('./bundle-camera-v01.json');if(!response.ok)throw Error('素材包加载失败 '+response.status);
 const bundle=await response.json();
 for(const action of ACTIONS){const option=document.createElement('option');option.value=action.id;option.textContent='动作 '+action.id+' · '+action.name;$('#action').append(option);}
 const images=[...new Set([...Object.values(bundle.poses),...Object.values(bundle.assets)].map(a=>a.dataUri))];
 await Promise.all(images.map(src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=resolve;img.onerror=()=>reject(Error('无法加载 '+src));img.src=src;})));
 stage.innerHTML=rootSvg('<g id="picture"></g>',cameraDefinitions(bundle),1920,1080,'01多机位动态预览');
 const picture=$('#picture');let time=0,playing=false,last=0,raf=0,duration=45,renderedFrame=-1;
 const beatButtons=[];
 function render(){
  const mode=$('#action').value;let state,name;
  if(mode==='camera'){state=sampleCameraScene(time);name=state.beat.id+' '+state.beat.name;picture.innerHTML=drawCameraScene(state,bundle,{debug:$('#joints').checked});}
  else{state=mode==='legacy'?sampleScene(time):sampleAction(mode,time);name=state.beat.name;picture.innerHTML=drawRoom(state,bundle,{debug:$('#joints').checked});}
  $('#clock').value=time.toFixed(2)+' / '+duration.toFixed(2)+'秒';$('#seek').value=time;
  $('#status').textContent=name+' ｜'+(mode==='camera'?'N1–N5已接入 · 24张姿态 · 12镜时间轴':'旧工艺对照 · 原21张姿态动作')+' · 无配音';
  stage.dataset.time=time.toFixed(3);stage.dataset.action=mode;stage.dataset.shot=mode==='camera'?state.beat.id:'';
  for(const [button,id] of beatButtons)button.setAttribute('aria-current',mode==='camera'&&state.beat.id===id?'true':'false');
 }
 function stop(){playing=false;$('#play').textContent='播放';cancelAnimationFrame(raf);last=0;}
 function tick(now){if(!playing)return;if(last)time=Math.min(duration,time+(now-last)/1000);last=now;const frame=Math.floor(time*30);if(frame!==renderedFrame||time>=duration){render();renderedFrame=frame;}if(time>=duration){stop();return;}raf=requestAnimationFrame(tick);}
 $('#play').disabled=false;$('#play').onclick=()=>{if(playing){stop();return;}if(time>=duration)time=0;playing=true;last=0;renderedFrame=-1;$('#play').textContent='暂停';raf=requestAnimationFrame(tick);};
 $('#seek').oninput=()=>{stop();time=Number($('#seek').value);render();};
 $('#action').onchange=()=>{stop();time=0;const mode=$('#action').value;duration=['camera','legacy'].includes(mode)?45:ACTIONS.find(a=>a.id===mode).duration;$('#seek').max=duration;render();};
 for(const beat of CAMERA_BEATS){const button=document.createElement('button');button.textContent=beat.id.replace('S01-','')+' '+beat.name;button.onclick=()=>{stop();$('#action').value='camera';duration=45;$('#seek').max=45;time=beat.start;render();};$('#keytimes').append(button);beatButtons.push([button,beat.id]);}
 $('#joints').onchange=render;window.addEventListener('pagehide',stop);render();
}catch(error){$('#error').hidden=false;$('#error').textContent=String(error);$('#loading')?.remove();}
</script></html>
